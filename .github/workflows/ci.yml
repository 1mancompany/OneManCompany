name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history for version comparison

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra sandbox --group dev

      - name: Version bump check
        run: |
          PR_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/version = "//;s/"//')
          MAIN_VERSION=$(git show origin/main:pyproject.toml | grep '^version = ' | head -1 | sed 's/version = "//;s/"//')
          echo "PR version: $PR_VERSION"
          echo "Main version: $MAIN_VERSION"
          uv run python -c "
          from packaging.version import Version
          pr, main = Version('$PR_VERSION'), Version('$MAIN_VERSION')
          if pr <= main:
              raise SystemExit(f'ERROR: PR version {pr} must be greater than main version {main}. Run pre-commit hook or bump manually.')
          print(f'OK: {pr} > {main}')
          "

      - name: Compilation check
        run: uv run python -c "from onemancompany.api.routes import router; print('OK')"

      - name: Unit tests
        run: uv run python -m pytest tests/unit/ -x -q

      - name: Integration tests
        run: uv run python -m pytest tests/integration/ -x -q

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend syntax check
        run: node --check frontend/app.js
